name: Build and deploy JAR app
 
on:
  push:
    branches:
      - main
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
 
      - name: Compile Java
        run: javac HelloWorld.java
 
      - name: Create JAR
        run: jar cfe HelloWorld.jar HelloWorld HelloWorld.class
 
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorld-JAR
          path: HelloWorld.jar
 
